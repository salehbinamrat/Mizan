name: Windows Core and Windows Release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-core:
    name: Windows Core
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MizanMedical.slnx
      - name: Build all projects
        run: dotnet build MizanMedical.slnx --configuration Release --no-restore
      - name: Run automated tests
        run: dotnet test tests/MizanMedical.Tests/MizanMedical.Tests.csproj --configuration Release --no-build
      - name: Publish x86 executable for immediate startup diagnosis
        run: dotnet publish src/MizanMedical.Desktop/MizanMedical.Desktop.csproj --configuration Release --runtime win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/preflight-x86
      - name: Launch x86 WPF startup smoke before packaging
        shell: pwsh
        run: ./scripts/test-windows-startup.ps1 -SingleExe artifacts/preflight-x86/MizanMedical.Desktop.exe

  windows-release:
    name: Windows Release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore all projects
        run: dotnet restore MizanMedical.slnx
      - name: Build code
        run: dotnet build MizanMedical.slnx --configuration Release --no-restore
      - name: Test BEFORE packaging
        run: dotnet test tests/MizanMedical.Tests/MizanMedical.Tests.csproj --configuration Release --no-build
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Create x86/x64 Portable and Installer
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Validate real Windows startup (x86 and x64 Portable + Installer)
        shell: pwsh
        run: ./scripts/test-windows-startup.ps1
      - name: Upload x86 Portable
        uses: actions/upload-artifact@v4
        with:
          name: MizanMedical-win-x86-Portable
          path: artifacts/MizanMedical-win-x86-Portable.zip
          if-no-files-found: error
      - name: Upload x86 Installer
        uses: actions/upload-artifact@v4
        with:
          name: MizanMedical-win-x86-Installer
          path: artifacts/installer/win-x86/MizanMedical-win-x86-Installer.exe
          if-no-files-found: error
      - name: Upload x64 Portable
        uses: actions/upload-artifact@v4
        with:
          name: MizanMedical-win-x64-Portable
          path: artifacts/MizanMedical-win-x64-Portable.zip
          if-no-files-found: error
      - name: Upload x64 Installer
        uses: actions/upload-artifact@v4
        with:
          name: MizanMedical-win-x64-Installer
          path: artifacts/installer/win-x64/MizanMedical-win-x64-Installer.exe
          if-no-files-found: error
